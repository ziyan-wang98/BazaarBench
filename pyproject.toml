[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bazaar-bench"
version = "0.1.0-alpha"
description = "A C2C agentic marketplace benchmark for studying bidirectional stakeholder safety"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "BazaarBench contributors" }
]
keywords = [
    "multi-agent",
    "llm",
    "benchmark",
    "agentic-marketplace",
    "stakeholder-drift",
    "pii-leakage",
]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "faker>=24.0",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
oasis = [
    "camel-oasis>=0.2.5",
]
memory = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.7",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.30",
    "azure-identity>=1.16",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["bazaar-bench[oasis,memory,llm,dev]"]

[project.scripts]
bazaar = "bazaar.cli:app"

# Project URLs are intentionally omitted for double-blind review and
# will be added in the camera-ready version.

[tool.setuptools.packages.find]
where = ["."]
include = ["bazaar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "llm: marks tests as requiring an LLM backend",
    "integration: marks end-to-end integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
